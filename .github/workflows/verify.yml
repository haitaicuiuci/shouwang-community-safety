name: Reproduce and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify committed public snapshot before retraining
        run: python tests/check_public_demo.py
      - run: bash run.sh reproduce
      - run: bash run.sh http-check
      - name: Report cross-platform differences without replacing the public snapshot
        run: python tests/report_reproduction.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-evidence
          path: |
            artifacts/results.json
            artifacts/policy.json
            artifacts/predictions.csv
            artifacts/run_manifest.json
            artifacts/http_verification.json
            artifacts/ci_comparison.json
