name: Reproduce and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash run.sh reproduce
      - run: bash run.sh http-check
      - run: python tests/check_public_demo.py
